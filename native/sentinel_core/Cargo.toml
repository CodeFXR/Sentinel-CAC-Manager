[package]
name = "sentinel_core"
version = "2.0.3"
edition = "2021"
description = "High-performance cryptographic and hardware accelerator for Sentinel CAC Manager"
license = "MIT"

[lib]
name = "sentinel_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.30" }
x509-parser = "0.16"
regex = "1.10"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
libloading = "0.8"
flate2 = "1.1.10"
